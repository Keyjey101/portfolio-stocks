<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Требуется вход</title>
<link rel="stylesheet" href="/style.css">
</head><body>
<div class="amb" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
<main class="wrap" style="max-width:460px;padding-top:14vh">
  <div class="bez spot"><div class="core">
    <div class="ph">Закрытый раздел</div>
    <p class="hero-p" style="margin:6px 0 16px">Аналитика оценки акций доступна только владельцу. Введи пароль — страница перезагрузится сама.</p>
    <label class="dec-full">Пароль<input id="pw" type="password" autocomplete="current-password"></label>
    <div class="cs dn" id="err" style="min-height:16px;margin:8px 0"></div>
    <div class="dec-actions">
      <button class="lab-btn" id="go">Войти</button>
      <a class="lab-btn" href="/" style="border-color:var(--line2);color:var(--ink2);text-decoration:none">к терминалу</a>
    </div>
  </div></div>
</main>
<script>
'use strict';
var go=function(){
  var b=document.getElementById('go');b.disabled=true;b.textContent='Проверяем…';
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:document.getElementById('pw').value})})
    .then(function(r){return r.json()}).then(function(j){
      if(j.ok)location.reload();
      else throw new Error(j.error||'неверный пароль');
    }).catch(function(e){
      b.disabled=false;b.textContent='Войти';document.getElementById('err').textContent=e.message;
    });
};
document.getElementById('go').addEventListener('click',go);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
document.getElementById('pw').focus();
</script>
</body></html>
